name: Test Relate graph preflight
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Relate dependency
        run: python -m pip install -r requirements.txt
      - name: Verify persistent synthetic Relate graph
        run: python -m unittest discover -s tests -v
      - name: Run standalone sample output
        run: python engine.py > /dev/null
